packages:
  - "apps/*"
  - "packages/*"

# ---------------------------------------------------------------------------
# Catalogs centralise dependency versions. Reference them in package.json with
# `"<dep>": "catalog:<name>"`. Never write a literal version in a package.json.
# ---------------------------------------------------------------------------
catalogs:
  # Tooling and libraries used by both BE and FE workspaces.
  generic:
    "@commitlint/cli": ^19.6.0
    "@commitlint/config-conventional": ^19.6.0
    "@ianvs/prettier-plugin-sort-imports": ^4.7.1
    blurhash: ^2.0.5
    # TipTap is used by admin-fe (editor) and the API (JSON -> HTML). Every
    # @tiptap/* package must be the same version, so these are exact pins.
    "@tiptap/core": 3.22.5
    "@tiptap/extension-image": 3.22.5
    "@tiptap/extension-placeholder": 3.22.5
    "@tiptap/extension-text-align": 3.22.5
    "@tiptap/html": 3.22.5
    "@tiptap/pm": 3.22.5
    "@tiptap/react": 3.22.5
    "@tiptap/starter-kit": 3.22.5
    "@types/node": ^22.19.13
    dayjs: ^1.11.20
    eslint: ^9.39.3
    husky: ^9.1.7
    prettier: ^3.8.1
    turbo: ^2.5.8
    typescript: ^5.9.3
    typescript-eslint: ^8.32.0
    vitest: ^3.2.4
    zod: ^4.3.6

  # Frontend (React / TanStack Start) workspaces.
  fe:
    "@ark-ui/react": ^5.36.0
    # 3D house visualizer (three.js + React Three Fiber).
    "@react-three/drei": ^10.7.9
    "@react-three/fiber": ^9.8.2
    "@inlang/paraglide-js": ^2.13.1
    "@t3-oss/env-core": ^0.13.10
    "@tailwindcss/forms": ^0.5.11
    "@tailwindcss/typography": ^0.5.19
    "@tailwindcss/vite": ^4.2.1
    "@tanstack/devtools-vite": ^0.3.12
    "@tanstack/eslint-config": ^0.3.4
    "@tanstack/react-devtools": ^0.7.11
    "@tanstack/react-form": ^1.28.3
    "@tanstack/react-pacer": ^0.21.1
    "@tanstack/react-query": ^5.90.21
    "@tanstack/react-query-devtools": ^5.91.3
    "@tanstack/react-router": ^1.163.3
    "@tanstack/react-router-devtools": ^1.163.3
    "@tanstack/react-start": ^1.166.1
    "@tanstack/react-store": ^0.9.1
    "@tanstack/react-table": ^8.21.3
    "@tanstack/router-plugin": ^1.164.0
    "@tanstack/store": ^0.9.1
    "@types/react": ^19.2.14
    "@types/react-dom": ^19.2.3
    "@types/three": ^0.186.0
    "@vitejs/plugin-react": ^5.1.4
    babel-plugin-react-compiler: ^1.0.0
    clsx: ^2.1.1
    lucide-react: ^0.545.0
    nitro: "npm:nitro-nightly@3.0.1-20260227-181935-bfbb207c"
    prettier-plugin-tailwindcss: ^0.7.2
    react: ^19.2.4
    react-dom: ^19.2.4
    recharts: ^3.10.1
    tailwindcss: ^4.2.1
    three: ^0.186.1
    vite: ^7.3.1
    vite-tsconfig-paths: ^5.1.4

  # Backend (Node / Express / Drizzle) workspaces.
  be:
    "@asteasolutions/zod-to-openapi": ^8.5.0
    "@scalar/express-api-reference": ^0.6.0
    "@swc-node/register": ^1.11.1
    "@swc/core": ^1.15.30
    "@types/bcrypt": ^5.0.2
    "@types/busboy": ^1.5.4
    "@types/express": ^5.0.0
    "@types/jsonwebtoken": ^9.0.7
    "@types/pg": ^8.11.0
    "@types/pino-http": ^6.1.0
    "@types/sanitize-html": ^2.16.2
    bcrypt: ^5.1.1
    busboy: ^1.6.0
    dotenv: ^17.4.2
    drizzle-kit: ^0.31.0
    drizzle-orm: ^0.44.0
    express: ^4.21.0
    express-rate-limit: ^7.5.0
    i18next: ^24.0.0
    jsonwebtoken: ^9.0.2
    openapi3-ts: ^4.5.0
    pg: ^8.20.0
    pino: ^10.3.1
    pino-http: ^11.0.0
    pino-pretty: ^13.1.3
    reflect-metadata: ^0.2.2
    sanitize-html: ^2.18.1
    sharp: ^0.34.4
    tsup: ^8.5.1
    tsyringe: ^4.10.0
