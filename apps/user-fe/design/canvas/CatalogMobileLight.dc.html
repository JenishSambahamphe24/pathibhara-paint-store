<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Catalog, mobile, shallow tree, light theme</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Teko:wght@400..700&amp;family=Mukta:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#1E3A7C}a:hover{color:#132656}
</style>
</helmet>
<div style="position: relative; width: 390px; min-height: 844px; background: #F5F1E8; color: #1E1B16; font-family: 'Mukta', system-ui, sans-serif; padding-bottom: 88px; box-sizing: border-box">
  <header style="background: #A3192B; padding: 5px">
    <div style="border: 2px solid #F2C230; border-radius: 3px; display: flex; align-items: center; justify-content: space-between; padding: 4px 4px 4px 12px; color: #FBF4E4">
      <a href="HomeMobileLight.dc.html" style="display: flex; flex-direction: column; line-height: 0.88; text-decoration: none; color: #FBF4E4; min-height: 44px; justify-content: center">
        <span lang="ne" style="font-family: 'Teko', sans-serif; font-weight: 500; font-size: 17px">पाथीभरा पेन्ट्स</span>
        <span style="font-family: 'Teko', sans-serif; font-weight: 600; font-size: 26px; text-transform: uppercase; letter-spacing: 0.03em">Pathibhara Paints</span>
      </a>
      <button type="button" aria-label="Menu" style="width: 44px; height: 44px; border: none; background: transparent; color: #FBF4E4; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    </div>
  </header>

  <nav aria-label="Category path" style="padding: 12px 16px 0">
    <ol style="list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 2px 4px; align-items: center; font-size: 14px">
      <sc-for list="{{crumbs}}" as="c" hint-placeholder-count="3">
        <li style="display: flex; align-items: center; gap: 4px; min-width: 0">
          <sc-if value="{{c.notLast}}" hint-placeholder-val="{{ true }}">
            <button type="button" onClick="{{c.go}}" style="min-height: 32px; border: none; background: transparent; padding: 0; font: 600 14px 'Mukta', sans-serif; color: #1E3A7C; text-decoration: underline; text-underline-offset: 3px">{{c.label}}</button>
            <span aria-hidden="true" style="color: #5E574B">/</span>
          </sc-if>
          <sc-if value="{{c.isLast}}" hint-placeholder-val="{{ false }}">
            <span aria-current="page" style="font-weight: 700; overflow-wrap: anywhere">{{c.label}}</span>
          </sc-if>
        </li>
      </sc-for>
    </ol>
  </nav>

  <section style="padding: 8px 16px 0; display: flex; flex-direction: column; gap: 12px">
    <h1 style="margin: 0; font-family: 'Teko', sans-serif; font-weight: 600; font-size: 46px; line-height: 0.88; text-transform: uppercase; overflow-wrap: anywhere">{{title}}</h1>
    <sc-if value="{{notRoot}}" hint-placeholder-val="{{ true }}">
      <button type="button" onClick="{{up}}" style="align-self: flex-start; min-height: 44px; display: flex; align-items: center; gap: 6px; border: none; background: transparent; padding: 0; font: 700 15px 'Mukta', sans-serif; color: #1E3A7C"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>{{upLabel}}</button>
    </sc-if>
    <sc-if value="{{hasKids}}" hint-placeholder-val="{{ true }}">
      <ul aria-label="Categories" style="list-style: none; margin: 0; padding: 0; background: #FFFDF8; border: 1px solid #D8D0BF; border-radius: 10px; overflow: hidden">
        <sc-for list="{{kids}}" as="k" hint-placeholder-count="3">
          <li style="border-bottom: 1px solid #ECE5D6">
            <button type="button" onClick="{{k.go}}" style="width: 100%; min-height: 54px; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 14px; border: none; background: transparent; text-align: left; color: #1E1B16">
              <span style="display: flex; flex-direction: column; line-height: 1.2"><span style="font-size: 16px; font-weight: 700">{{k.name}}</span><span style="font-size: 13px; color: #5E574B">{{k.count}}</span></span>
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
            </button>
          </li>
        </sc-for>
      </ul>
    </sc-if>
  </section>

  <section style="padding: 20px 16px 0; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; justify-content: space-between; align-items: baseline">
      <h2 style="margin: 0; font-size: 16px; font-weight: 700">{{count}}</h2>
      <span style="font-size: 13px; color: #5E574B">Sample prices</span>
    </div>
    <sc-if value="{{empty}}" hint-placeholder-val="{{ false }}">
      <div style="padding: 20px; background: #FFFDF8; border: 1px dashed #D8D0BF; border-radius: 10px; display: flex; flex-direction: column; gap: 6px">
        <span style="font-family: 'Teko', sans-serif; font-weight: 600; font-size: 26px; text-transform: uppercase">Nothing here yet</span>
        <span style="font-size: 14px; color: #5E574B">Ask the store on WhatsApp; most products can be ordered in a day or two.</span>
      </div>
    </sc-if>
    <ul style="list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
      <sc-for list="{{items}}" as="p" hint-placeholder-count="4">
        <li>
          <a href="{{p.href}}" style="display: flex; flex-direction: column; gap: 6px; text-decoration: none; color: #1E1B16">
            <span style="aspect-ratio: 1 / 1; border-radius: 10px; overflow: hidden; background: #ECE5D6; display: block; position: relative">
              <sc-if value="{{p.hasImg}}" hint-placeholder-val="{{ false }}"><img src="{{p.img}}" alt="" style="{{p.imgStyle}}"></sc-if>
              <sc-if value="{{p.noImg}}" hint-placeholder-val="{{ true }}">
                <span style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; color: #5E574B">
                  <svg width="44" height="53" viewBox="0 0 48 58" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><path d="M8 16 Q24 0 40 16"></path><path d="M6 16 L9.5 50 Q24 55 38.5 50 L42 16"></path><path d="M8.4 30 H39.6 L38.6 41 H9.4 Z" fill="#D8D0BF" stroke="none"></path><ellipse cx="24" cy="16" rx="18" ry="4.5"></ellipse></svg>
                  <span style="font-family: 'Teko', sans-serif; font-weight: 600; font-size: 18px; text-transform: uppercase; text-align: center; padding: 0 8px; line-height: 1">{{p.cat}}</span>
                </span>
              </sc-if>
            </span>
            <span style="font-size: 12px; font-weight: 700; color: #5E574B">{{p.brand}}</span>
            <span style="font-size: 15px; font-weight: 700; line-height: 1.25; overflow-wrap: anywhere">{{p.name}}</span>
            <span style="font-size: 13px; color: #5E574B">{{p.sizes}}</span>
            <span style="font-family: 'Teko', sans-serif; font-weight: 500; font-size: 24px; line-height: 1">{{p.from}}</span>
          </a>
        </li>
      </sc-for>
    </ul>
  </section>

  <nav aria-label="Contact the store" style="position: absolute; left: 0; right: 0; bottom: 0; padding: 10px 12px 14px; background: #FFFDF8; border-top: 1px solid #D8D0BF; display: grid; grid-template-columns: 1fr 1.6fr 1fr; gap: 8px">
    <a href="#" style="min-height: 48px; border-radius: 6px; border: 1px solid #D8D0BF; color: #1E1B16; font-family: 'Teko', sans-serif; font-weight: 600; font-size: 21px; text-transform: uppercase; padding-top: 3px; display: flex; align-items: center; justify-content: center; text-decoration: none">Call</a>
    <a href="#" style="min-height: 48px; border-radius: 6px; background: #1D6B3F; color: #FFFFFE; font-family: 'Teko', sans-serif; font-weight: 600; font-size: 21px; text-transform: uppercase; padding-top: 3px; display: flex; align-items: center; justify-content: center; text-decoration: none">WhatsApp</a>
    <a href="#" style="min-height: 48px; border-radius: 6px; border: 1px solid #D8D0BF; color: #1E1B16; font-family: 'Teko', sans-serif; font-weight: 600; font-size: 21px; text-transform: uppercase; padding-top: 3px; display: flex; align-items: center; justify-content: center; text-decoration: none">Map</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1500}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { path: [], open: { primer: true, extPrimer: true, damp: true, intPaint: true } };
  }
  tree() {
    return [
      { id: 'primer', name: 'Primer', kids: [
        { id: 'intPrimer', name: 'Interior primer' },
        { id: 'extPrimer', name: 'Exterior primer', kids: [
          { id: 'damp', name: 'Damp-proof primer', kids: [
            { id: 'dampCement', name: 'Cement-based' },
            { id: 'dampAcrylic', name: 'Acrylic' }
          ] },
          { id: 'basecoat', name: 'Basecoat' }
        ] }
      ] },
      { id: 'intPaint', name: 'Interior paint', kids: [
        { id: 'luxury', name: 'Luxury emulsion' },
        { id: 'economy', name: 'Economy emulsion' },
        { id: 'ceiling', name: 'Ceiling white' }
      ] },
      { id: 'extPaint', name: 'Exterior paint', kids: [
        { id: 'weather', name: 'Weather emulsion' },
        { id: 'texture', name: 'Texture finish' }
      ] },
      { id: 'enamel', name: 'Enamel', kids: [{ id: 'woodMetal', name: 'Wood & metal' }] },
      { id: 'water', name: 'Waterproofing', kids: [
        { id: 'roof', name: 'Roof & terrace' },
        { id: 'bath', name: 'Bathroom' },
        { id: 'basement', name: 'Basement & walls' }
      ] },
      { id: 'tools', name: 'Tools & sundries' }
    ];
  }
  products() {
    return [
      { cat: 'luxury', name: 'Royale Luxury Finish', brand: 'Asian Paints', img: '/_blob/22f1192bf5c3eb5b9bc13d873999a06d', fit: 'cover', from: 1450, sizes: '1 · 4 · 10 · 18 L' },
      { cat: 'basecoat', name: 'Ultima Basecoat', brand: 'Asian Paints', img: '/_blob/cbeb017aa0ccef5b490b3be4ee33fcb7', fit: 'contain', from: 850, sizes: '1 · 4 · 10 · 20 L' },
      { cat: 'dampCement', name: '[Product name]', brand: '[Brand]', img: null, from: 920, sizes: '1 · 4 · 20 L' },
      { cat: 'dampCement', name: '[A much longer product name that wraps onto two lines]', brand: '[Brand]', img: null, from: 1180, sizes: '4 · 20 L' },
      { cat: 'dampAcrylic', name: '[Product name]', brand: '[Brand]', img: null, from: 1340, sizes: '1 · 4 · 10 · 20 L' },
      { cat: 'intPrimer', name: '[Product name]', brand: '[Brand]', img: null, from: 580, sizes: '1 · 4 · 10 · 20 L' },
      { cat: 'economy', name: '[Product name]', brand: '[Brand]', img: null, from: 690, sizes: '1 · 4 · 10 · 20 L' },
      { cat: 'ceiling', name: '[Product name]', brand: '[Brand]', img: null, from: 540, sizes: '4 · 10 · 20 L' },
      { cat: 'weather', name: '[Product name]', brand: '[Brand]', img: null, from: 1150, sizes: '1 · 4 · 10 · 20 L' },
      { cat: 'texture', name: '[Product name]', brand: '[Brand]', img: null, from: 1990, sizes: '20 L' },
      { cat: 'woodMetal', name: '[Product name]', brand: '[Brand]', img: null, from: 560, sizes: '0.5 · 1 · 4 L' },
      { cat: 'roof', name: '[Product name]', brand: '[Brand]', img: null, from: 1420, sizes: '1 · 4 · 20 L' },
      { cat: 'bath', name: '[Product name]', brand: '[Brand]', img: null, from: 980, sizes: '1 · 4 L' },
      { cat: 'tools', name: '[Roller, 9 inch]', brand: '[Brand]', img: null, from: 450, sizes: 'Each' }
    ];
  }
  npr(x) {
    const d = String(Math.round(x));
    if (d.length <= 3) return 'Rs. ' + d;
    return 'Rs. ' + d.slice(0, -3).replace(/\B(?=(\d{2})+(?!\d))/g, ',') + ',' + d.slice(-3);
  }
  renderVals() {
    const T = this.tree();
    const st = this.state;
    const index = {};
    const walk = (nodes, parents) => nodes.forEach((n) => { index[n.id] = { node: n, parents }; if (n.kids) walk(n.kids, parents.concat([n.id])); });
    walk(T, []);
    const desc = (id) => { const n = index[id].node; return [id].concat((n.kids || []).reduce((a, k) => a.concat(desc(k.id)), [])); };
    const path = st.path;
    const curId = path.length ? path[path.length - 1] : null;
    const cur = curId ? index[curId].node : { name: 'All products', kids: T };
    const inScope = curId ? desc(curId) : null;
    const all = this.products();
    const list = all.filter((p) => !inScope || inScope.indexOf(p.cat) >= 0);
    const go = (p) => () => this.setState({ path: p });
    const crumbs = [{ label: 'Products', go: go([]), isLast: path.length === 0, notLast: path.length !== 0 }].concat(path.map((id, i) => ({ label: index[id].node.name, go: go(path.slice(0, i + 1)), isLast: i === path.length - 1, notLast: i !== path.length - 1 })));
    const countIn = (id) => all.filter((p) => desc(id).indexOf(p.cat) >= 0).length;
    const kids = (cur.kids || []).map((k) => ({ name: k.name, count: countIn(k.id) + ' products', hasKids: !!k.kids, go: go(path.concat([k.id])) }));
    const rows = [];
    const flat = (nodes, depth) => nodes.forEach((n) => {
      const isOpen = !!st.open[n.id];
      const onPath = path.indexOf(n.id) >= 0;
      const isCur = n.id === curId;
      rows.push({
        name: n.name, hasKids: !!n.kids, isOpen, count: countIn(n.id), current: isCur ? 'page' : 'false',
        chev: isOpen ? 'transform: rotate(90deg); transition: transform .15s' : 'transition: transform .15s',
        toggle: () => this.setState({ open: Object.assign({}, st.open, { [n.id]: !isOpen }) }),
        go: () => this.setState({ path: index[n.id].parents.concat([n.id]), open: Object.assign({}, st.open, { [n.id]: true }) }),
        rowStyle: 'display: flex; align-items: center; gap: 4px; padding-left: ' + (depth * 16) + 'px; border-radius: 6px; ' + (isCur ? 'background: #1E1B16; color: #FFFDF8;' : onPath ? 'background: #ECE5D6;' : ''),
        linkStyle: 'flex: 1; min-width: 0; min-height: 40px; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 0 8px; border: none; background: transparent; text-align: left; font: ' + (isCur || onPath ? '700' : '500') + ' 15px \'Mukta\', sans-serif; color: inherit',
        spacer: !n.kids
      });
      if (n.kids && isOpen) flat(n.kids, depth + 1);
    });
    flat(T, 0);
    return {
      title: cur.name,
      crumbs,
      kids,
      hasKids: kids.length > 0,
      isRoot: path.length === 0,
      notRoot: path.length > 0,
      upLabel: path.length > 1 ? 'Back to ' + index[path[path.length - 2]].node.name : 'Back to all products',
      up: go(path.slice(0, -1)),
      rows,
      showAll: go([]),
      allCurrent: path.length === 0 ? 'page' : 'false',
      allStyle: 'width: 100%; min-height: 40px; padding: 0 8px; border: none; border-radius: 6px; text-align: left; font: 700 15px \'Mukta\', sans-serif; ' + (path.length === 0 ? 'background: #1E1B16; color: #FFFDF8;' : 'background: transparent; color: #1E1B16;'),
      count: list.length + (list.length === 1 ? ' product' : ' products'),
      empty: list.length === 0,
      items: list.map((p) => ({
        name: p.name, brand: p.brand, sizes: p.sizes, from: 'From ' + this.npr(p.from), hasImg: !!p.img, noImg: !p.img, img: p.img,
        imgStyle: 'width: 100%; height: 100%; object-fit: ' + (p.fit || 'cover') + '; display: block; ' + (p.fit === 'contain' ? 'padding: 10px; box-sizing: border-box;' : ''),
        cat: index[p.cat].node.name,
        href: p.name === 'Royale Luxury Finish' ? 'ProductMobileLight.dc.html' : '#'
      }))
    };
  }
}

</script>
</body>
</html>
